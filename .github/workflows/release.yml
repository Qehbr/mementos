name: Release

# Triggered by pushing a git tag matching v*.*.* (e.g. v1.0.0, v1.0.1, v1.1.0-rc.1).
# Auth: npm Trusted Publishing via OIDC (configured on npmjs.com for this package +
# this workflow). No NPM_TOKEN secret needed — `id-token: write` below is what npm
# exchanges for a short-lived publish token at run time. Trusted Publishing requires
# npm >= 11.5.1, which is why this workflow uses Node 24 (ships npm 11) instead of
# Node 22 (ships npm 10, doesn't speak the new OIDC handshake).
on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  publish:
    name: Build + test + publish to npm
    runs-on: ubuntu-latest
    permissions:
      contents: write   # required to create the GitHub Release at the end of this job
      id-token: write   # required for OIDC auth to npm (trusted publishing)
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm

      - run: npm ci

      - name: Tag matches package.json version
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::tag $GITHUB_REF_NAME (=$TAG_VERSION) does not match package.json version $PKG_VERSION"
            exit 1
          fi

      - run: npm run lint
      - run: npm run build

      # Optional peerDeps (hnswlib-node, re2, simple-git, …) are installed by
      # the suite's global setup into ~/.config/mementos/plugins/ — same
      # mechanism as CI and as `mementos init` at runtime.
      - run: npm test

      - name: Publish to npm
        run: npm publish --access public

      # Last, so a Release only ever appears for a version that actually reached npm.
      # `gh` is preinstalled on GitHub runners — no third-party action, no extra
      # supply-chain surface.
      #
      # Idempotent on purpose: a tag can arrive here two ways — pushed from the CLI
      # (no Release exists yet, so create one) or created by publishing a Release in
      # the GitHub UI, which pushes the tag and triggers this workflow (a Release
      # already exists, and overwriting it would discard hand-written notes). Without
      # the guard the second path fails the job *after* npm has already published.
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists — leaving its notes untouched."
          else
            gh release create "$GITHUB_REF_NAME" \
              --title "$GITHUB_REF_NAME" \
              --verify-tag \
              --generate-notes
          fi
