name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Lint + build + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck + build
        run: npm run build

      # Optional peerDependencies are normally installed on demand by
      # `mementos init` into ~/.config/mementos/plugins/. The vitest suite
      # exercises code that requires them (hnswlib-node, re2, simple-git),
      # so install them into the same location the runtime resolves from.
      - name: Install optional plugins for tests
        run: |
          mkdir -p ~/.config/mementos/plugins
          npm install --prefix ~/.config/mementos/plugins --no-save \
            hnswlib-node@3.0.0 re2@1.24.1 simple-git@3.36.0 bonjour-service@1.3.0

      - name: Test
        run: npm test
